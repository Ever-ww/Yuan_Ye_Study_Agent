[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yy-agent"
version = "1.0.0"
description = "Local-first asynchronous study agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["croniter>=6.2,<7", "cryptography>=43,<47", "fastapi>=0.110,<1", "httpx>=0.27,<1", "openpyxl>=3.1,<4", "pydantic>=2.8,<3", "pypdf>=6.14,<7", "python-docx>=1.2,<2", "python-pptx>=1,<2", "PyYAML>=6,<7", "rich>=13.7,<15", "typer>=0.12,<1", "tzdata>=2025.2,<2027", "tzlocal>=5,<6", "uvicorn>=0.29,<1", "websockets>=14,<17"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pyinstaller>=6.10,<7"]

[project.scripts]
yy-agent = "run_ui.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["Agent*", "backup*", "bootstrap*", "context_process*", "cron*", "dream*", "gateway*", "memory*", "paper_library*", "prompt*", "reference*", "sandbox*", "skill*", "tool*", "tools*", "run_ui*"]

[tool.setuptools.package-data]
bootstrap = ["templates/*.example"]
run_ui = ["templates/*.html", "static/*.css", "static/*.js"]
sandbox = ["Dockerfile"]

[tool.setuptools.data-files]
"harness-evolution" = ["harness-evolution/harness.py"]
"skills/search-summary-paper" = ["skills/search-summary-paper/SKILL.md"]
"skills/search-summary-paper/references" = ["skills/search-summary-paper/references/summary-template.md"]
"extension" = ["extension/README.md"]
"extension/hook/trace_start" = ["extension/hook/trace_start/trace_start.py"]
"extension/hook/trace_end" = ["extension/hook/trace_end/trace_end.py"]
"extension/hook/turn_start" = ["extension/hook/turn_start/turn_start.py"]
"extension/hook/turn_end" = ["extension/hook/turn_end/turn_end.py"]
"extension/hook/model_before" = ["extension/hook/model_before/model_before.py"]
"extension/hook/model_during" = ["extension/hook/model_during/model_during.py"]
"extension/hook/model_after" = ["extension/hook/model_after/model_after.py"]
"extension/hook/tool_before" = ["extension/hook/tool_before/tool_before.py"]
"extension/hook/tool_during" = ["extension/hook/tool_during/tool_during.py"]
"extension/hook/tool_after" = ["extension/hook/tool_after/tool_after.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

name: native-sandbox

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'sandbox/**'
      - 'Agent/config.py'
      - 'Agent/runtime/**'
      - 'tool/registry.py'
      - 'tools/bash.py'
      - 'tests/test_native_sandbox.py'
      - '.github/workflows/native-sandbox.yml'

permissions:
  contents: read

jobs:
  isolation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: '0.11.29'
          python-version: '3.12'
      - name: Install Linux OS sandbox dependency
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
      - run: uv sync --frozen --extra dev
      - name: Native boundary and lifecycle tests (no silent skips on supported OS)
        env:
          YY_RUN_NATIVE_SANDBOX_TESTS: '1'
        run: uv run --frozen --extra dev python -m pytest tests/test_native_sandbox.py tests/test_sandbox.py tests/test_file_locks.py -q
